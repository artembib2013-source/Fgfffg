<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TG-like Chat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 14px system-ui, sans-serif; background: #e6ebee; height: 100vh; overflow: hidden; }
  .hidden { display: none !important; }

  /* Auth */
  #auth { display: flex; align-items: center; justify-content: center; height: 100vh; padding: 16px; }
  .card { background: #fff; padding: 24px; border-radius: 12px; width: 100%; max-width: 340px; box-shadow: 0 8px 30px rgba(0,0,0,.1); }
  .card h2 { margin-bottom: 16px; font-size: 20px; }
  .card input { width: 100%; padding: 12px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  .card button { width: 100%; padding: 12px; margin-top: 8px; background: #3390ec; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 15px; }
  .card button:hover { background: #2b7fd4; }
  .card .switch { text-align: center; margin-top: 12px; font-size: 13px; color: #666; cursor: pointer; }
  .err { color: #c22; font-size: 13px; margin-top: 6px; }
  .note { font-size: 11px; color: #888; margin-top: 12px; line-height: 1.4; }

  /* Main */
  #app { display: grid; grid-template-columns: 1fr; height: 100vh; }
  @media (min-width: 700px) { #app { grid-template-columns: 300px 1fr; } }
  .sidebar { background: #fff; border-right: 1px solid #ddd; display: flex; flex-direction: column; }
  .sidebar header { padding: 12px; border-bottom: 1px solid #eee; display: flex; align-items: center; justify-content: space-between; }
  .sidebar header .me { font-weight: 600; }
  .sidebar header .me small { color: #888; font-weight: normal; font-size: 11px; display: block; }
  .sidebar header button { background: none; border: none; cursor: pointer; color: #3390ec; font-size: 13px; }
  .chat-list { flex: 1; overflow-y: auto; }
  .chat-item { padding: 12px; cursor: pointer; border-bottom: 1px solid #f0f0f0; }
  .chat-item:hover { background: #f5f8fa; }
  .chat-item.active { background: #3390ec; color: #fff; }
  .chat-item .name { font-weight: 600; }
  .chat-item .meta { font-size: 11px; color: #999; }
  .chat-item.active .meta { color: #cde; }
  .sidebar .actions { padding: 8px; border-top: 1px solid #eee; }
  .sidebar .actions button { width: 100%; padding: 10px; background: #3390ec; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .sidebar .actions .dev-btn { background: #d6274a; margin-top: 6px; }

  .main { display: flex; flex-direction: column; background: #dfe6ec; height: 100vh; }
  .main header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
  .main header h3 { font-size: 15px; }
  .main header .tools button { background: none; border: 1px solid #ccc; border-radius: 6px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
  .messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 8px 12px; background: #fff; border-radius: 12px; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.05); }
  .msg.mine { align-self: flex-end; background: #effdde; }
  .msg .author { font-size: 11px; color: #3390ec; font-weight: 600; margin-bottom: 2px; }
  .msg .time { font-size: 10px; color: #999; text-align: right; margin-top: 2px; }
  .composer { padding: 10px; background: #fff; border-top: 1px solid #ddd; display: flex; gap: 8px; }
  .composer input { flex: 1; padding: 10px 14px; border: 1px solid #ccc; border-radius: 20px; font-size: 15px; }
  .composer button { padding: 10px 20px; border: none; background: #3390ec; color: #fff; border-radius: 20px; cursor: pointer; font-size: 16px; }
  .placeholder { color: #888; text-align: center; margin-top: 40px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
  .modal { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; }
  .modal h3 { margin-bottom: 12px; }
  .modal input, .modal textarea { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  .modal textarea { min-height: 70px; resize: vertical; }
  .modal button { padding: 10px 16px; border: none; border-radius: 8px; background: #3390ec; color: #fff; cursor: pointer; margin-top: 8px; font-size: 14px; }
  .modal .close { background: #eee; color: #333; margin-left: 6px; }
  .user-pick { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; border-bottom: 1px solid #f5f5f5; }
  .user-pick span { flex: 1; }
  .dev-chat { border: 1px solid #eee; padding: 10px; border-radius: 8px; margin: 6px 0; font-size: 13px; }
  .dev-chat .title { font-weight: 600; cursor: pointer; color: #3390ec; }
  .dev-chat .msgs { margin-top: 6px; max-height: 200px; overflow-y: auto; background: #f7f7f7; padding: 8px; border-radius: 6px; font-size: 12px; line-height: 1.5; }
  .broadcast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); background: #d6274a; color: #fff; padding: 12px 20px; border-radius: 10px; z-index: 100; box-shadow: 0 4px 16px rgba(0,0,0,.3); max-width: 90vw; }

  /* Back button on mobile */
  #back-btn { display: none; background: none; border: none; font-size: 20px; cursor: pointer; margin-right: 8px; }
  @media (max-width: 699px) {
    .sidebar { display: flex; }
    .main { display: none; }
    #app.chat-open .sidebar { display: none; }
    #app.chat-open .main { display: flex; }
    #back-btn { display: inline-block; }
  }
</style>
</head>
<body>

<!-- ========== AUTH ========== -->
<div id="auth">
  <div class="card">
    <h2 id="auth-title">Вход</h2>
    <input id="username" placeholder="Логин" autocomplete="username">
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password">
    <button id="auth-btn" onclick="doAuth()">Войти</button>
    <div class="switch" onclick="toggleAuth()">
      <span id="auth-switch">Нет аккаунта? Зарегистрироваться</span>
    </div>
    <div class="err" id="auth-err"></div>
    <div class="note">
      ⚠️ Все сообщения хранятся на сервере и доступны администрации (роль dev).
      Не отправляйте конфиденциальную информацию.
    </div>
  </div>
</div>

<!-- ========== APP ========== -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <header>
      <div class="me">
        <div id="me-name"></div>
        <small id="me-role"></small>
      </div>
      <button onclick="logout()">Выйти</button>
    </header>
    <div class="chat-list" id="chat-list"></div>
    <div class="actions">
      <button onclick="openCreateChat()">+ Новый чат</button>
      <button id="dev-btn" class="dev-btn hidden" onclick="openDevPanel()">🛠 Панель разработчика</button>
    </div>
  </aside>

  <main class="main">
    <header>
      <div style="display:flex;align-items:center">
        <button id="back-btn" onclick="closeChat()">←</button>
        <h3 id="chat-title">Выбери чат</h3>
      </div>
      <div class="tools">
        <button id="btn-members" class="hidden" onclick="openMembers()">Участники</button>
      </div>
    </header>
    <div class="messages" id="messages">
      <div class="placeholder">Выбери чат слева или создай новый</div>
    </div>
    <div class="composer hidden" id="composer">
      <input id="msg-input" placeholder="Сообщение..." autocomplete="off">
      <button onclick="sendMessage()">➤</button>
    </div>
  </main>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
/* ================= state ================= */
let me = null;
let socket = null;
let currentChatId = null;
let currentChats = [];
let authMode = 'login';

/* ================= utils ================= */
const $ = id => document.getElementById(id);
async function api(url, method = 'GET', body) {
  const r = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Ошибка');
  return data;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}

/* ================= auth ================= */
function toggleAuth() {
  authMode = authMode === 'login' ? 'register' : 'login';
  $('auth-title').textContent = authMode === 'login' ? 'Вход' : 'Регистрация';
  $('auth-btn').textContent = authMode === 'login' ? 'Войти' : 'Зарегистрироваться';
  $('auth-switch').textContent = authMode === 'login'
    ? 'Нет аккаунта? Зарегистрироваться'
    : 'Уже есть аккаунт? Войти';
  $('auth-err').textContent = '';
}

async function doAuth() {
  $('auth-err').textContent = '';
  const username = $('username').value.trim();
  const password = $('password').value;
  try {
    const url = authMode === 'login' ? '/api/login' : '/api/register';
    const { user } = await api(url, 'POST', { username, password });
    me = user;
    startApp();
  } catch (e) {
    $('auth-err').textContent = e.message;
  }
}

async function logout() {
  await api('/api/logout', 'POST');
  location.reload();
}

/* ================= start ================= */
async function startApp() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('me-name').textContent = me.username;
  $('me-role').textContent = me.role === 'dev' ? 'разработчик' : 'пользователь';
  if (me.role === 'dev') $('dev-btn').classList.remove('hidden');

  socket = io();

  socket.on('connect', () => console.log('[ws] connected'));
  socket.on('message', onMessage);
  socket.on('broadcast', b => showBroadcast(b.text));
  socket.on('member_added', refreshChats);
  socket.on('member_removed', refreshChats);
  socket.on('kicked', ({ chatId }) => {
    if (currentChatId === chatId) {
      currentChatId = null;
      $('chat-title').textContent = 'Выбери чат';
      $('messages').innerHTML = '<div class="placeholder">Тебя исключили из чата</div>';
      $('composer').classList.add('hidden');
      $('app').classList.remove('chat-open');
    }
    refreshChats();
  });

  await refreshChats();
}

/* ================= chats ================= */
async function refreshChats() {
  const { chats } = await api('/api/chats');
  currentChats = chats;
  renderChatList();
}

function renderChatList() {
  const list = $('chat-list');
  list.innerHTML = '';
  if (!currentChats.length) {
    list.innerHTML = '<div style="padding:12px;color:#888;font-size:13px">Пока нет чатов</div>';
    return;
  }
  currentChats.forEach(c => {
    const d = document.createElement('div');
    d.className = 'chat-item' + (c.id === currentChatId ? ' active' : '');
    d.innerHTML = `<div class="name">${esc(c.name)}</div>
                   <div class="meta">${c.is_group ? 'группа' : 'личный'}</div>`;
    d.onclick = () => openChat(c.id);
    list.appendChild(d);
  });
}

async function openChat(chatId) {
  currentChatId = chatId;
  renderChatList();
  const chat = currentChats.find(c => c.id === chatId);
  $('chat-title').textContent = chat ? chat.name : 'Чат';
  $('composer').classList.remove('hidden');
  $('btn-members').classList.remove('hidden');
  $('btn-members').onclick = openMembers;
  $('app').classList.add('chat-open');

  const { messages } = await api(`/api/chats/${chatId}/messages`);
  const box = $('messages');
  box.innerHTML = '';
  messages.forEach(m => box.appendChild(renderMessage(m)));
  box.scrollTop = box.scrollHeight;
  $('msg-input').focus();
}

function closeChat() {
  $('app').classList.remove('chat-open');
  currentChatId = null;
  renderChatList();
}

function renderMessage(m) {
  const d = document.createElement('div');
  d.className = 'msg' + (me && m.user_id === me.id ? ' mine' : '');
  d.dataset.id = m.id;
  const showAuthor = me && m.user_id !== me.id;
  d.innerHTML = `
    ${showAuthor ? `<div class="author">${esc(m.username)}</div>` : ''}
    <div>${esc(m.text)}</div>
    <div class="time">${fmtTime(m.created_at)}</div>
  `;
  return d;
}

function onMessage(m) {
  if (m.chat_id !== currentChatId) return;
  const box = $('messages');
  if (box.querySelector('.placeholder')) box.innerHTML = '';
  box.appendChild(renderMessage(m));
  box.scrollTop = box.scrollHeight;
}

function sendMessage() {
  const input = $('msg-input');
  const text = input.value.trim();
  if (!text || !currentChatId) return;
  socket.emit('message', { chatId: currentChatId, text });
  input.value = '';
  input.focus();
}
$('msg-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
});

/* ================= modal helpers ================= */
function modal(html) {
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  const m = document.createElement('div');
  m.className = 'modal';
  m.innerHTML = html;
  bg.appendChild(m);
  bg.onclick = e => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg);
  return { bg, m };
}

/* ================= create chat ================= */
async function openCreateChat() {
  const { users } = await api('/api/users');
  const { bg, m } = modal(`
    <h3>Новый чат</h3>
    <input id="chat-name" placeholder="Название чата">
    <div style="margin-top:8px;font-size:13px;color:#666">Выбери участников:</div>
    <div id="user-pick" style="max-height:200px;overflow-y:auto;margin-top:6px">
      ${users.filter(u => u.id !== me.id).map(u => `
        <label class="user-pick">
          <input type="checkbox" value="${u.id}"> <span>${esc(u.username)}</span>
        </label>
      `).join('') || '<div style="color:#888;font-size:13px">Пока нет других пользователей</div>'}
    </div>
    <button id="create-go">Создать</button>
    <button class="close" onclick="this.closest('.modal-bg').remove()">Отмена</button>
  `);
  m.querySelector('#create-go').onclick = async () => {
    const name = m.querySelector('#chat-name').value.trim();
    const memberIds = [...m.querySelectorAll('#user-pick input:checked')].map(i => +i.value);
    if (!name) return alert('Введи название');
    await api('/api/chats', 'POST', { name, memberIds });
    bg.remove();
    await refreshChats();
  };
}

/* ================= members management ================= */
async function openMembers() {
  if (!currentChatId) return;
  const [{ users }, { members }] = await Promise.all([
    api('/api/users'),
    api(`/api/chats/${currentChatId}/members`).catch(() => ({ members: [] }))
  ]);

  const memberIds = new Set((members || []).map(u => u.id));
  const { bg, m } = modal(`
    <h3>Участники чата</h3>
    <div id="members-list" style="margin-top:8px">
      ${(members || []).map(u => `
        <div class="user-pick">
          <span>${esc(u.username)}</span>
          <button data-remove="${u.id}" style="background:#c22;color:#fff;padding:4px 10px;font-size:12px;border:none;border-radius:6px;cursor:pointer">Убрать</button>
        </div>
      `).join('') || '<div style="color:#888;font-size:13px">Пусто</div>'}
    </div>
    <hr style="margin:12px 0;border:none;border-top:1px solid #eee">
    <div style="font-size:13px;color:#666;margin-bottom:4px">Добавить:</div>
    <div id="add-list">
      ${users.filter(u => !memberIds.has(u.id)).map(u => `
        <div class="user-pick">
          <span>${esc(u.username)}</span>
          <button data-add="${u.id}" style="background:#3390ec;color:#fff;padding:4px 10px;font-size:12px;border:none;border-radius:6px;cursor:pointer">Добавить</button>
        </div>
      `).join('') || '<div style="color:#888;font-size:13px">Все уже в чате</div>'}
    </div>
    <button class="close" style="margin-top:12px" onclick="this.closest('.modal-bg').remove()">Закрыть</button>
  `);

  m.querySelectorAll('[data-remove]').forEach(b => {
    b.onclick = async () => {
      await api(`/api/chats/${currentChatId}/members/${b.dataset.remove}`, 'DELETE');
      bg.remove(); openMembers(); refreshChats();
    };
  });
  m.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      await api(`/api/chats/${currentChatId}/members`, 'POST', { userId: +b.dataset.add });
      bg.remove(); openMembers(); refreshChats();
    };
  });
}

/* ================= DEV panel ================= */
async function openDevPanel() {
  const [{ chats }, { users }] = await Promise.all([
    api('/api/dev/chats'),
    api('/api/dev/users')
  ]);
  const { bg, m } = modal(`
    <h3>🛠 Панель разработчика</h3>

    <div style="margin-top:10px;font-weight:600;font-size:14px">📢 Рассылка всем</div>
    <textarea id="bc-text" placeholder="Текст рассылки..."></textarea>
    <button id="bc-send">Отправить всем</button>

    <div style="margin-top:16px;font-weight:600;font-size:14px">👥 Пользователи (${users.length})</div>
    <div style="max-height:120px;overflow-y:auto;font-size:12px;color:#555;margin-top:6px">
      ${users.map(u => `<div>#${u.id} ${esc(u.username)} — ${u.role}</div>`).join('')}
    </div>

    <div style="margin-top:16px;font-weight:600;font-size:14px">💬 Все чаты (${chats.length})</div>
    <div id="dev-chats"></div>

    <button class="close" style="margin-top:12px" onclick="this.closest('.modal-bg').remove()">Закрыть</button>
  `);

  const devChats = m.querySelector('#dev-chats');
  for (const c of chats) {
    const d = document.createElement('div');
    d.className = 'dev-chat';
    d.innerHTML = `
      <div class="title" data-id="${c.id}">
        ${esc(c.name)} — ${esc(c.creator)} · ${c.member_count} уч. · ${c.message_count} сообщ.
      </div>
      <div class="msgs hidden" id="dev-msgs-${c.id}">Загрузка...</div>
      <div style="margin-top:6px">
        <button data-manage="${c.id}" style="font-size:12px;padding:5px 10px;background:#3390ec;color:#fff;border:none;border-radius:6px;cursor:pointer">
          Управлять участниками
        </button>
      </div>
    `;
    devChats.appendChild(d);
  }

  devChats.querySelectorAll('.title').forEach(t => {
    t.onclick = async () => {
      const id = t.dataset.id;
      const box = devChats.querySelector(`#dev-msgs-${id}`);
      if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
      const { messages } = await api(`/api/chats/${id}/messages`);
      box.innerHTML = messages.map(msg =>
        `<div><b>${esc(msg.username)}</b> [${fmtTime(msg.created_at)}]: ${esc(msg.text)}</div>`
      ).join('') || '<i>Пусто</i>';
      box.classList.remove('hidden');
    };
  });

  devChats.querySelectorAll('[data-manage]').forEach(b => {
    b.onclick = () => openDevMembers(+b.dataset.manage);
  });

  m.querySelector('#bc-send').onclick = async () => {
    const text = m.querySelector('#bc-text').value.trim();
    if (!text) return;
    await api('/api/dev/broadcast', 'POST', { text });
    m.querySelector('#bc-text').value = '';
    alert('Отправлено всем');
  };
}

async function openDevMembers(chatId) {
  const { users } = await api('/api/dev/users');
  const { bg, m } = modal(`
    <h3>Управление участниками чата #${chatId}</h3>
    <div id="dev-manage-list">
      ${users.filter(u => u.role !== 'dev').map(u => `
        <div class="user-pick">
          <span>#${u.id} ${esc(u.username)}</span>
          <button data-add="${u.id}" style="background:#3390ec;color:#fff;padding:4px 10px;font-size:12px;border:none;border-radius:6px;cursor:pointer">Добавить</button>
          <button data-rm="${u.id}" style="background:#c22;color:#fff;padding:4px 10px;font-size:12px;border:none;border-radius:6px;cursor:pointer;margin-left:4px">Убрать</button>
        </div>
      `).join('')}
    </div>
    <button class="close" onclick="this.closest('.modal-bg').remove()">Закрыть</button>
  `);
  m.querySelectorAll('[data-add]').forEach(b => {
    b.onclick = async () => {
      await api(`/api/dev/chats/${chatId}/members`, 'POST', { userId: +b.dataset.add });
      alert('Добавлен');
    };
  });
  m.querySelectorAll('[data-rm]').forEach(b => {
    b.onclick = async () => {
      await api(`/api/chats/${chatId}/members/${b.dataset.rm}`, 'DELETE');
      alert('Удалён');
    };
  });
}

/* ================= broadcast toast ================= */
function showBroadcast(text) {
  const d = document.createElement('div');
  d.className = 'broadcast';
  d.textContent = '📢 ' + text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), 8000);
}
</script>
</body>
        </html>
